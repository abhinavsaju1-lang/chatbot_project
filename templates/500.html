{% extends "base.html" %}
{% block title %}MindSense-AI | Service Temporarily Unavailable (500){% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto p-6 flex-grow flex flex-col justify-center items-center text-center space-y-6">
    <div class="w-20 h-20 rounded-3xl bg-rose-500/10 text-rose-500 border border-rose-500/20 flex items-center justify-center text-3xl shadow-lg">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div class="space-y-2">
        <h1 class="font-outfit font-extrabold text-4xl text-slate-800 dark:text-white">Service Temporarily Busy</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto">
            Our AI engine or database encountered a transient hiccup. Please refresh the page or return to the dashboard.
        </p>
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button onclick="window.location.reload()" class="px-6 py-3 bg-gradient-to-r from-teal-600 to-indigo-600 hover:from-teal-500 hover:to-indigo-500 text-white font-bold rounded-2xl shadow-lg transition text-sm">
            <i class="fa-solid fa-rotate-right mr-1.5"></i> Try Again
        </button>
        <a href="/dashboard" class="px-6 py-3 bg-white/70 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-2xl transition text-sm">
            <i class="fa-solid fa-chart-line mr-1.5"></i> Dashboard
        </a>
    </div>
</div>
{% endblock %}
